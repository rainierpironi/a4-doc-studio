    // Formata a data atual do sistema de acordo com o padrão escolhido
    function formatSystemDate(dateObj = new Date(), format = 'DD/MM/YYYY') {
      const day = String(dateObj.getDate()).padStart(2, '0');
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const yearFull = String(dateObj.getFullYear());
      const yearShort = yearFull.slice(-2);

      if (format === 'DD/MM/YY') {
        return `${day}/${month}/${yearShort}`;
      }
      if (format === 'EXTENSO') {
        return dateObj.toLocaleDateString('pt-BR', {
          day: '2-digit',
          month: 'long',
          year: 'numeric'
        });
      }
      return `${day}/${month}/${yearFull}`;
    }

    const rgbToHex = (r, g, b) => {
      const toHex = (n) => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    };

    const getLuminance = (r, g, b) => 0.299 * r + 0.587 * g + 0.114 * b;

    // ============================================================================
    // MOTOR DE AUTO-CALIBRAÇÃO POR PIXELS (COR DE FUNDO, TINTA, TAMANHO E PESO)
    // ============================================================================
    function analyzeRegionPixels(imgElement, rect) {
      try {
        const canvas = document.createElement('canvas');
        const w = Math.max(8, Math.round(rect.width));
        const h = Math.max(8, Math.round(rect.height));
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        ctx.drawImage(
          imgElement,
          Math.max(0, Math.round(rect.x)),
          Math.max(0, Math.round(rect.y)),
          w,
          h,
          0,
          0,
          w,
          h
        );

        const imgData = ctx.getImageData(0, 0, w, h).data;
        const pixels = [];

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const idx = (y * w + x) * 4;
            const r = imgData[idx];
            const g = imgData[idx + 1];
            const b = imgData[idx + 2];
            const lum = getLuminance(r, g, b);
            pixels.push({ r, g, b, lum, x, y });
          }
        }

        const sortedByLum = [...pixels].sort((a, b) => b.lum - a.lum);
        const topBgCount = Math.max(1, Math.floor(pixels.length * 0.3));
        let bgR = 0, bgG = 0, bgB = 0, bgLumAvg = 0;
        for (let i = 0; i < topBgCount; i++) {
          bgR += sortedByLum[i].r;
          bgG += sortedByLum[i].g;
          bgB += sortedByLum[i].b;
          bgLumAvg += sortedByLum[i].lum;
        }
        bgR /= topBgCount;
        bgG /= topBgCount;
        bgB /= topBgCount;
        bgLumAvg /= topBgCount;

        const maskColor = rgbToHex(bgR, bgG, bgB);
        const inkPixels = pixels.filter((p) => bgLumAvg - p.lum > 42);

        let textColor = '#1e293b';
        let minInkY = h;
        let maxInkY = 0;

        if (inkPixels.length > 5) {
          const sortedInk = [...inkPixels].sort((a, b) => a.lum - b.lum);
          const darkestCount = Math.max(1, Math.floor(sortedInk.length * 0.35));
          let inkR = 0, inkG = 0, inkB = 0;
          for (let i = 0; i < darkestCount; i++) {
            inkR += sortedInk[i].r;
            inkG += sortedInk[i].g;
            inkB += sortedInk[i].b;
          }
          textColor = rgbToHex(inkR / darkestCount, inkG / darkestCount, inkB / darkestCount);

          inkPixels.forEach((p) => {
            if (p.y < minInkY) minInkY = p.y;
            if (p.y > maxInkY) maxInkY = p.y;
          });
        }

        const measuredGlyphHeight =
          maxInkY > minInkY + 4 ? maxInkY - minInkY + 2 : Math.round(h * 0.56);
        const estimatedFontSize = Math.max(
          11,
          Math.min(72, Math.round(measuredGlyphHeight * 1.18))
        );

        const activeArea = Math.max(1, w * Math.max(8, measuredGlyphHeight));
        const inkDensity = inkPixels.length / activeArea;

        return {
          maskColor,
          textColor,
          fontSize: estimatedFontSize,
          fontWeight: '400',
          inkDensity: Number(inkDensity.toFixed(2)),
          cropDataUrl: canvas.toDataURL('image/png')
        };
      } catch (err) {
        return {
          maskColor: '#ffffff',
          textColor: '#1e293b',
          fontSize: Math.max(12, Math.round(rect.height * 0.55)),
          fontWeight: '400',
          inkDensity: 0.15,
          cropDataUrl: null
        };
      }
    }

    // Detecta automaticamente as bordas internas de uma caixinha vazia [ ] ao redor do clique
    function detectCheckboxAroundPoint(imgElement, clickX, clickY) {
      try {
        const searchRadius = 38;
        const startX = Math.max(0, Math.round(clickX - searchRadius));
        const startY = Math.max(0, Math.round(clickY - searchRadius));
        const w = searchRadius * 2;
        const h = searchRadius * 2;

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imgElement, startX, startY, w, h, 0, 0, w, h);

        const data = ctx.getImageData(0, 0, w, h).data;
        const getLumAt = (x, y) => {
          const idx = (Math.max(0, Math.min(h - 1, y)) * w + Math.max(0, Math.min(w - 1, x))) * 4;
          return getLuminance(data[idx], data[idx + 1], data[idx + 2]);
        };

        const cx = searchRadius;
        const cy = searchRadius;

        let leftEdge = null;
        let rightEdge = null;
        let topEdge = null;
        let bottomEdge = null;

        for (let dx = 2; dx < searchRadius - 2; dx++) {
          if (leftEdge === null && getLumAt(cx - dx, cy) < 165) leftEdge = cx - dx;
          if (rightEdge === null && getLumAt(cx + dx, cy) < 165) rightEdge = cx + dx;
        }
        for (let dy = 2; dy < searchRadius - 2; dy++) {
          if (topEdge === null && getLumAt(cx, cy - dy) < 165) topEdge = cy - dy;
          if (bottomEdge === null && getLumAt(cx, cy + dy) < 165) bottomEdge = cy + dy;
        }

        let darkestR = 30, darkestG = 41, darkestB = 59, minLum = 255;
        for (let i = 0; i < data.length; i += 4) {
          const lum = getLuminance(data[i], data[i + 1], data[i + 2]);
          if (lum < minLum) {
            minLum = lum;
            darkestR = data[i];
            darkestG = data[i + 1];
            darkestB = data[i + 2];
          }
        }
        const detectedInkColor = minLum < 180 ? rgbToHex(darkestR, darkestG, darkestB) : '#1e293b';

        if (
          leftEdge !== null &&
          rightEdge !== null &&
          topEdge !== null &&
          bottomEdge !== null
        ) {
          const boxW = rightEdge - leftEdge;
          const boxH = bottomEdge - topEdge;
          if (boxW >= 12 && boxW <= 70 && boxH >= 12 && boxH <= 70) {
            return {
              x: startX + leftEdge,
              y: startY + topEdge,
              width: boxW,
              height: boxH,
              fontSize: Math.max(14, Math.round(Math.min(boxW, boxH) * 0.72)),
              textColor: detectedInkColor
            };
          }
        }

        const defaultSize = 32;
        return {
          x: Math.round(clickX - defaultSize / 2),
          y: Math.round(clickY - defaultSize / 2),
          width: defaultSize,
          height: defaultSize,
          fontSize: 22,
          textColor: detectedInkColor
        };
      } catch (e) {
        return {
          x: Math.round(clickX - 16),
          y: Math.round(clickY - 16),
          width: 32,
          height: 32,
          fontSize: 22,
          textColor: '#1e293b'
        };
      }
    }

    // ============================================================================
    // RENDERIZADOR DE ALTA RESOLUÇÃO (IMPRESSÃO A4 E EXPORTAÇÃO PDF)
    // ============================================================================
    function renderCompositePageToCanvas(page, imgElement, globalVarsMap, showMasks = true) {
      const canvas = document.createElement('canvas');
      const width = page.width || imgElement.naturalWidth || 1240;
      const height = page.height || imgElement.naturalHeight || 1754;
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      ctx.drawImage(imgElement, 0, 0, width, height);

      if (!showMasks) return canvas;

      (page.boxes || []).forEach((box) => {
        const pad = Number(box.maskPadding ?? 2);

        ctx.save();
        if (!box.transparentMask) {
          ctx.fillStyle = box.maskColor || '#ffffff';
          ctx.fillRect(
            box.x - pad,
            box.y - pad,
            box.width + pad * 2,
            box.height + pad * 2
          );
        }

        let finalText = box.text || '';
        Object.keys(globalVarsMap).forEach((k) => {
          const escapedKey = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const regex = new RegExp(`\\{\\{${escapedKey}\\}\\}`, 'gi');
          finalText = finalText.replace(regex, globalVarsMap[k]);
        });
        if (box.uppercase) {
          finalText = finalText.toUpperCase();
        }

        const style = box.fontStyle === 'italic' ? 'italic ' : '';
        const weight = box.fontWeight === '700' || box.fontWeight === 'bold' ? 'bold ' : '';
        const size = Number(box.fontSize) || 20;
        const family = box.fontFamily || 'Arial Narrow';

        ctx.font = `${style}${weight}${size}px "${family}", Arial, sans-serif`;
        ctx.fillStyle = box.textColor || '#1e293b';
        ctx.textBaseline = 'middle';

        if ('letterSpacing' in ctx) {
          ctx.letterSpacing = `${Number(box.letterSpacing || 0)}px`;
        }

        const centerY = box.y + box.height / 2;
        let drawX = box.x + 4;

        if (box.textAlign === 'center') {
          ctx.textAlign = 'center';
          drawX = box.x + box.width / 2;
        } else if (box.textAlign === 'right') {
          ctx.textAlign = 'right';
          drawX = box.x + box.width - 4;
        } else {
          ctx.textAlign = 'left';
          drawX = box.x + 4;
        }

        ctx.fillText(finalText, drawX, centerY);
        ctx.restore();
      });

      return canvas;
    }

    // ============================================================================
    // COMPONENTE PRINCIPAL DA APLICAÇÃO
    // ============================================================================
    function App() {
      const [pages, setPages] = useState([]);
      const [activePageId, setActivePageId] = useState(null);
      const [selectedBoxId, setSelectedBoxId] = useState(null);

      const [autoDateEnabled, setAutoDateEnabled] = useState(true);
      const [dateFormat, setDateFormat] = useState('DD/MM/YYYY');

      const [globalVars, setGlobalVars] = useState(() => {
        try {
          const saved = localStorage.getItem('a4docstudio_global_vars_v1');
          const todayFormatted = formatSystemDate(new Date(), 'DD/MM/YYYY');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed.map((v) =>
                v.key.toLowerCase() === 'data' || v.isAutoDate
                  ? { ...v, value: todayFormatted, isAutoDate: true }
                  : v
              );
            }
          }
        } catch (e) {}
        return getInitialGlobalVars('DD/MM/YYYY');
      });

      const [newVarKey, setNewVarKey] = useState('');
      const [newVarLabel, setNewVarLabel] = useState('');
      const [newVarValue, setNewVarValue] = useState('');

      const [availableFonts, setAvailableFonts] = useState(DEFAULT_DOCUMENT_FONTS);
      const [systemFontsStatus, setSystemFontsStatus] = useState('idle');

      const [toolMode, setToolMode] = useState('draw');
      const [checkboxSymbol, setCheckboxSymbol] = useState('X');
      const [zoom, setZoom] = useState(0.62);
      const [compareOriginal, setCompareOriginal] = useState(false);
      const [activeTabRight, setActiveTabRight] = useState('variables');

      const [interaction, setInteraction] = useState(null);
      const [aiAnalyzing, setAiAnalyzing] = useState(false);
      const [pdfGenerating, setPdfGenerating] = useState(false);
      const [printSnapshots, setPrintSnapshots] = useState([]);
      const [toastMessage, setToastMessage] = useState(null);

      const imageElementsRef = useRef({});
      const pageContainerRef = useRef(null);
      const fileInputRef = useRef(null);
      const fontInputRef = useRef(null);
      const templateInputRef = useRef(null);

      const showToast = useCallback((msg, type = 'info') => {
        setToastMessage({ msg, type });
        setTimeout(() => {
          setToastMessage((prev) => (prev?.msg === msg ? null : prev));
        }, 4000);
      }, []);

      const syncTodayDate = useCallback(
        (fmt = dateFormat, showNotification = false) => {
          const currentFormatted = formatSystemDate(new Date(), fmt);
          setGlobalVars((prev) => {
            const hasDataVar = prev.some(
              (v) => v.key.toLowerCase() === 'data' || v.isAutoDate
            );
            if (!hasDataVar) {
              return [
                { key: 'Data', label: 'Data', value: currentFormatted, isAutoDate: true },
                ...prev
              ];
            }
            return prev.map((v) =>
              v.key.toLowerCase() === 'data' || v.isAutoDate
                ? { ...v, value: currentFormatted, isAutoDate: true }
                : v
            );
          });
          if (showNotification) {
            showToast(`Campo "Data" atualizado com a data de hoje: ${currentFormatted}`, 'success');
          }
        },
        [dateFormat, showToast]
      );

      useEffect(() => {
        if (!autoDateEnabled) return;
        syncTodayDate(dateFormat, false);
        const interval = setInterval(() => {
          syncTodayDate(dateFormat, false);
        }, 60000);
        return () => clearInterval(interval);
      }, [autoDateEnabled, dateFormat, syncTodayDate]);

      useEffect(() => {
        try {
          localStorage.setItem('a4docstudio_global_vars_v1', JSON.stringify(globalVars));
        } catch (e) {}
      }, [globalVars]);

      const globalVarsMap = useMemo(() => {
        const map = {};
        globalVars.forEach((v) => {
          map[v.key] = v.value;
        });
        return map;
      }, [globalVars]);

      useEffect(() => {
        pages.forEach((p) => {
          if (!imageElementsRef.current[p.id]) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.src = p.dataUrl;
            imageElementsRef.current[p.id] = img;
          }
        });
      }, [pages]);

      const activePage = useMemo(
        () => pages.find((p) => p.id === activePageId) || null,
        [pages, activePageId]
      );

      const selectedBox = useMemo(() => {
        if (!activePage || !selectedBoxId) return null;
        return activePage.boxes.find((b) => b.id === selectedBoxId) || null;
      }, [activePage, selectedBoxId]);

      const resolveText = useCallback(
        (rawText, uppercase = false) => {
          if (!rawText) return '';
          let out = rawText;
          Object.keys(globalVarsMap).forEach((k) => {
            const escapedKey = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`\\{\\{${escapedKey}\\}\\}`, 'gi');
            out = out.replace(regex, globalVarsMap[k]);
          });
          return uppercase ? out.toUpperCase() : out;
        },
        [globalVarsMap]
      );

      // Detecção de fontes nativas do sistema (Font Access API)
      const detectSystemFonts = async () => {
        if (!('queryLocalFonts' in window)) {
          setSystemFontsStatus('unsupported');
          showToast(
            'A API queryLocalFonts não está disponível neste navegador. Use "+ Fonte .TTF/.OTF" para importar.',
            'warning'
          );
          return;
        }

        try {
          setSystemFontsStatus('loading');
          const localFonts = await window.queryLocalFonts();
          const uniqueFamilies = new Set(availableFonts.map((f) => f.name));
          const newFontList = [...availableFonts];

          localFonts.forEach((lf) => {
            if (lf.family && !uniqueFamilies.has(lf.family)) {
              uniqueFamilies.add(lf.family);
              newFontList.push({
                name: lf.family,
                family: `"${lf.family}", sans-serif`,
                category: 'Fonte Instalada no Sistema'
              });
            }
          });

          setAvailableFonts(newFontList);
          setSystemFontsStatus('loaded');
          showToast(`${newFontList.length} fontes locais detectadas com sucesso!`, 'success');
        } catch (err) {
          setSystemFontsStatus('unsupported');
          showToast(
            'Permissão negada pelo navegador. Você pode carregar qualquer fonte .TTF/.OTF diretamente.',
            'warning'
          );
        }
      };

      const handleCustomFontUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        try {
          const cleanName = file.name.replace(/\.(ttf|otf|woff2?|TTF|OTF)$/i, '');
          const buffer = await file.arrayBuffer();
          const fontFace = new FontFace(cleanName, buffer);
          const loadedFace = await fontFace.load();
          document.fonts.add(loadedFace);

          setAvailableFonts((prev) => [
            {
              name: cleanName,
              family: `"${cleanName}", sans-serif`,
              category: 'Fonte Importada (.TTF/.OTF)'
            },
            ...prev.filter((f) => f.name !== cleanName)
          ]);

          if (selectedBoxId) {
            updateSelectedBox({ fontFamily: cleanName });
          }
          showToast(`Fonte "${cleanName}" importada e aplicada com sucesso!`, 'success');
        } catch (err) {
          showToast('Não foi possível carregar este arquivo de fonte. Verifique se é um .TTF ou .OTF válido.', 'error');
        } finally {
          e.target.value = '';
        }
      };

      const handleUploadPages = (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;

        files.forEach((file) => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const dataUrl = ev.target.result;
            const img = new Image();
            img.onload = () => {
              const newPageId = `page-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
              imageElementsRef.current[newPageId] = img;

              const newPage = {
                id: newPageId,
                name: file.name,
                dataUrl,
                width: img.naturalWidth || 1240,
                height: img.naturalHeight || 1754,
                boxes: []
              };

              setPages((prev) => {
                const updated = [...prev, newPage];
                if (!activePageId) setActivePageId(newPageId);
                return updated;
              });
              setActivePageId(newPageId);
            };
            img.src = dataUrl;
          };
          reader.readAsDataURL(file);
        });

        showToast(`${files.length} página(s) A4 adicionada(s)!`, 'success');
        e.target.value = '';
      };

      const movePageOrder = (idx, direction) => {
        setPages((prev) => {
          const targetIdx = idx + direction;
          if (targetIdx < 0 || targetIdx >= prev.length) return prev;
          const copy = [...prev];
          const [moved] = copy.splice(idx, 1);
          copy.splice(targetIdx, 0, moved);
          return copy;
        });
      };

      const removePage = (idToRemove) => {
        setPages((prev) => {
          const filtered = prev.filter((p) => p.id !== idToRemove);
          if (activePageId === idToRemove) {
            setActivePageId(filtered[0]?.id || null);
            setSelectedBoxId(null);
          }
          return filtered;
        });
        showToast('Página removida da fila de preparação.', 'info');
      };

      const updateSelectedBox = useCallback(
        (patch) => {
          if (!activePageId || !selectedBoxId) return;
          setPages((prev) =>
            prev.map((page) => {
              if (page.id !== activePageId) return page;
              return {
                ...page,
                boxes: page.boxes.map((b) => (b.id === selectedBoxId ? { ...b, ...patch } : b))
              };
            })
          );
        },
        [activePageId, selectedBoxId]
      );

      const deleteBoxById = useCallback(
        (boxIdToRemove) => {
          if (!activePageId || !boxIdToRemove) return;
          setPages((prev) =>
            prev.map((page) => {
              if (page.id !== activePageId) return page;
              return {
                ...page,
                boxes: page.boxes.filter((b) => b.id !== boxIdToRemove)
              };
            })
          );
          setSelectedBoxId((prev) => (prev === boxIdToRemove ? null : prev));
          showToast('Caixa de substituição removida.', 'info');
        },
        [activePageId, showToast]
      );

      const deleteSelectedBox = useCallback(() => {
        if (!selectedBoxId) return;
        deleteBoxById(selectedBoxId);
      }, [selectedBoxId, deleteBoxById]);

      // Atalho de teclado: Delete ou Backspace exclui a caixa selecionada
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (!selectedBoxId) return;
          const activeEl = document.activeElement;
          const isTypingField =
            activeEl &&
            (activeEl.tagName === 'INPUT' ||
              activeEl.tagName === 'TEXTAREA' ||
              activeEl.tagName === 'SELECT' ||
              activeEl.isContentEditable);

          if (isTypingField) return;

          if (e.key === 'Delete' || e.key === 'Backspace') {
            e.preventDefault();
            deleteBoxById(selectedBoxId);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [selectedBoxId, deleteBoxById]);

      const replicateBoxToAllPages = () => {
        if (!selectedBox || !activePageId) return;
        setPages((prev) =>
          prev.map((p) => {
            if (p.id === activePageId) return p;
            const clonedBox = {
              ...selectedBox,
              id: `box-${p.id}-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`
            };
            return {
              ...p,
              boxes: [...p.boxes, clonedBox]
            };
          })
        );
        showToast('Caixa de substituição copiada para todas as páginas na mesma posição!', 'success');
      };

      const recalibrateBoxFromPixels = (boxTarget = selectedBox) => {
        if (!activePage || !boxTarget) return;
        const imgEl = imageElementsRef.current[activePage.id];
        if (!imgEl) return;

        const analysis = analyzeRegionPixels(imgEl, boxTarget);
        updateSelectedBox({
          maskColor: analysis.maskColor,
          textColor: analysis.textColor,
          fontSize: analysis.fontSize,
          fontWeight: analysis.fontWeight,
          autoCalibrated: true
        });
        showToast(
          `Fonte autocalibrada: ${analysis.fontSize}px, peso ${analysis.fontWeight === '700' ? 'Negrito' : 'Normal'}, fundo ${analysis.maskColor}`,
          'success'
        );
      };

      const analyzeFontAndTextWithAI = async () => {
        if (!activePage || !selectedBox) return;
        const imgEl = imageElementsRef.current[activePage.id];
        if (!imgEl) return;

        setAiAnalyzing(true);
        try {
          const pixelStats = analyzeRegionPixels(imgEl, selectedBox);
          const base64Data = (pixelStats.cropDataUrl || '').split(',')[1];
          if (!base64Data) throw new Error('Recorte inválido');

          const apiKey = '';
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          const prompt = `Analise este recorte de um documento impresso/digitalizado em folha A4.
1. Transcreva exatamente o texto visível na imagem (detectedText).
2. Identifique a família tipográfica padrão mais próxima entre: "Arial Narrow", "Arial", "Calibri", "Times New Roman", "Tahoma", "Verdana", "Courier New", "Consolas", "Georgia", "Trebuchet MS".
3. Informe se está em negrito (isBold), itálico (isItalic) ou tudo em maiúsculas (isUppercase).`;

          const payload = {
            contents: [
              {
                parts: [
                  { text: prompt },
                  { inlineData: { mimeType: 'image/png', data: base64Data } }
                ]
              }
            ],
            generationConfig: {
              responseMimeType: 'application/json',
              responseSchema: {
                type: 'OBJECT',
                properties: {
                  detectedText: { type: 'STRING' },
                  fontFamily: { type: 'STRING' },
                  isBold: { type: 'BOOLEAN' },
                  isItalic: { type: 'BOOLEAN' },
                  isUppercase: { type: 'BOOLEAN' }
                },
                required: ['detectedText', 'fontFamily', 'isBold']
              }
            }
          };

          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!res.ok) throw new Error('Falha na chamada da API');
          const data = await res.json();
          const parsed = JSON.parse(data.candidates?.[0]?.content?.parts?.[0]?.text || '{}');

          updateSelectedBox({
            originalText: parsed.detectedText || selectedBox.originalText,
            text:
              selectedBox.text === 'Novo Termo' && parsed.detectedText
                ? parsed.detectedText
                : selectedBox.text,
            fontFamily: parsed.fontFamily || selectedBox.fontFamily,
            fontWeight: parsed.isBold ? '700' : pixelStats.fontWeight,
            fontStyle: parsed.isItalic ? 'italic' : 'normal',
            uppercase: Boolean(parsed.isUppercase),
            maskColor: pixelStats.maskColor,
            textColor: pixelStats.textColor,
            fontSize: pixelStats.fontSize
          });

          showToast(
            `IA detectou fonte "${parsed.fontFamily}" (${pixelStats.fontSize}px) e termo "${parsed.detectedText}"`,
            'success'
          );
        } catch (err) {
          recalibrateBoxFromPixels(selectedBox);
        } finally {
          setAiAnalyzing(false);
        }
      };

      const getPageCoordinates = (clientX, clientY) => {
        if (!pageContainerRef.current || !activePage) return { x: 0, y: 0 };
        const rect = pageContainerRef.current.getBoundingClientRect();
        const scaleX = activePage.width / rect.width;
        const scaleY = activePage.height / rect.height;
        return {
          x: Math.max(0, Math.min(activePage.width, Math.round((clientX - rect.left) * scaleX))),
          y: Math.max(0, Math.min(activePage.height, Math.round((clientY - rect.top) * scaleY)))
        };
      };

      const handleCanvasMouseDown = (e) => {
        if (!activePage || compareOriginal) return;
        if (e.target.dataset.boxHandle || e.target.dataset.boxItem) return;

        const coords = getPageCoordinates(e.clientX, e.clientY);

        if (toolMode === 'mark_x') {
          setInteraction({
            type: 'marking_x',
            startX: coords.x,
            startY: coords.y,
            currentX: coords.x,
            currentY: coords.y
          });
          setSelectedBoxId(null);
        } else if (toolMode === 'draw') {
          setInteraction({
            type: 'drawing',
            startX: coords.x,
            startY: coords.y,
            currentX: coords.x,
            currentY: coords.y
          });
          setSelectedBoxId(null);
        } else {
          setSelectedBoxId(null);
        }
      };

      const handleBoxMouseDown = (e, box, mode = 'moving') => {
        e.stopPropagation();
        if (compareOriginal) return;
        setSelectedBoxId(box.id);
        setActiveTabRight('inspector');
        const coords = getPageCoordinates(e.clientX, e.clientY);

        setInteraction({
          type: mode,
          boxId: box.id,
          startX: coords.x,
          startY: coords.y,
          initialBox: { ...box }
        });
      };

      const handleCanvasMouseMove = (e) => {
        if (!interaction || !activePage) return;
        const coords = getPageCoordinates(e.clientX, e.clientY);

        if (interaction.type === 'drawing' || interaction.type === 'marking_x') {
          setInteraction((prev) => ({
            ...prev,
            currentX: coords.x,
            currentY: coords.y
          }));
        } else if (interaction.type === 'moving') {
          const dx = coords.x - interaction.startX;
          const dy = coords.y - interaction.startY;
          const init = interaction.initialBox;
          const nextX = Math.max(0, Math.min(activePage.width - init.width, init.x + dx));
          const nextY = Math.max(0, Math.min(activePage.height - init.height, init.y + dy));

          setPages((prev) =>
            prev.map((p) => {
              if (p.id !== activePage.id) return p;
              return {
                ...p,
                boxes: p.boxes.map((b) =>
                  b.id === interaction.boxId ? { ...b, x: nextX, y: nextY } : b
                )
              };
            })
          );
        } else if (interaction.type === 'resizing') {
          const dx = coords.x - interaction.startX;
          const dy = coords.y - interaction.startY;
          const init = interaction.initialBox;
          const nextW = Math.max(24, Math.min(activePage.width - init.x, init.width + dx));
          const nextH = Math.max(14, Math.min(activePage.height - init.y, init.height + dy));

          setPages((prev) =>
            prev.map((p) => {
              if (p.id !== activePage.id) return p;
              return {
                ...p,
                boxes: p.boxes.map((b) =>
                  b.id === interaction.boxId ? { ...b, width: nextW, height: nextH } : b
                )
              };
            })
          );
        }
      };

      const handleCanvasMouseUp = () => {
        if (!interaction || !activePage) return;

        if (interaction.type === 'marking_x') {
          const dragW = Math.abs(interaction.currentX - interaction.startX);
          const dragH = Math.abs(interaction.currentY - interaction.startY);
          const imgEl = imageElementsRef.current[activePage.id];

          let boxRect;
          if (dragW > 12 && dragH > 12) {
            const x = Math.min(interaction.startX, interaction.currentX);
            const y = Math.min(interaction.startY, interaction.currentY);
            const autoStats = imgEl
              ? analyzeRegionPixels(imgEl, { x, y, width: dragW, height: dragH })
              : { textColor: '#1e293b' };
            boxRect = {
              x,
              y,
              width: dragW,
              height: dragH,
              fontSize: Math.max(12, Math.round(Math.min(dragW, dragH) * 0.72)),
              textColor: autoStats.textColor || '#1e293b'
            };
          } else {
            boxRect = imgEl
              ? detectCheckboxAroundPoint(imgEl, interaction.startX, interaction.startY)
              : {
                  x: interaction.startX - 16,
                  y: interaction.startY - 16,
                  width: 32,
                  height: 32,
                  fontSize: 22,
                  textColor: '#1e293b'
                };
          }

          const newBoxId = `box-x-${Date.now()}`;
          const newBox = {
            id: newBoxId,
            x: boxRect.x,
            y: boxRect.y,
            width: boxRect.width,
            height: boxRect.height,
            originalText: '[ ]',
            text: checkboxSymbol || 'X',
            linkedVar: '',
            fontFamily: 'Arial Narrow',
            fontSize: boxRect.fontSize,
            fontWeight: '700',
            fontStyle: 'normal',
            textColor: boxRect.textColor,
            maskColor: '#ffffff',
            transparentMask: true,
            isCheckbox: true,
            letterSpacing: 0,
            textAlign: 'center',
            uppercase: false,
            maskPadding: 0,
            autoCalibrated: true
          };

          setPages((prev) =>
            prev.map((p) =>
              p.id === activePage.id ? { ...p, boxes: [...p.boxes, newBox] } : p
            )
          );
          setSelectedBoxId(newBoxId);
          setActiveTabRight('inspector');
          showToast(`Marcação "${checkboxSymbol}" inserida! (Botão direito ou Delete para excluir)`, 'success');
          setInteraction(null);
          return;
        }

        if (interaction.type === 'drawing') {
          const x = Math.min(interaction.startX, interaction.currentX);
          const y = Math.min(interaction.startY, interaction.currentY);
          const width = Math.abs(interaction.currentX - interaction.startX);
          const height = Math.abs(interaction.currentY - interaction.startY);

          if (width > 18 && height > 12) {
            const imgEl = imageElementsRef.current[activePage.id];
            const autoStats = imgEl
              ? analyzeRegionPixels(imgEl, { x, y, width, height })
              : {
                  maskColor: '#ffffff',
                  textColor: '#1e293b',
                  fontSize: Math.round(height * 0.55),
                  fontWeight: '400'
                };

            const newBoxId = `box-${Date.now()}`;
            const newBox = {
              id: newBoxId,
              x,
              y,
              width,
              height,
              originalText: 'Termo Selecionado',
              text: 'Novo Termo',
              linkedVar: '',
              fontFamily: 'Arial Narrow',
              fontSize: autoStats.fontSize,
              fontWeight: '400',
              fontStyle: 'normal',
              textColor: autoStats.textColor,
              maskColor: autoStats.maskColor,
              transparentMask: false,
              isCheckbox: false,
              letterSpacing: 0,
              textAlign: 'left',
              uppercase: false,
              maskPadding: 2,
              autoCalibrated: true
            };

            setPages((prev) =>
              prev.map((p) =>
                p.id === activePage.id ? { ...p, boxes: [...p.boxes, newBox] } : p
              )
            );
            setSelectedBoxId(newBoxId);
            setActiveTabRight('inspector');
            showToast(
              `Termo mapeado! Fonte autocalibrada em ${autoStats.fontSize}px com cor de fundo ${autoStats.maskColor}.`,
              'success'
            );
          }
        }

        setInteraction(null);
      };

      const handleGenerateMultiPagePDF = async () => {
        if (!pages.length) return;
        setPdfGenerating(true);
        try {
          const jsPDF = window.jspdf?.jsPDF;
          if (!jsPDF) throw new Error('jsPDF não carregado');

          const pdf = new jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: 'a4',
            compress: true
          });

          for (let i = 0; i < pages.length; i++) {
            const page = pages[i];
            let imgEl = imageElementsRef.current[page.id];
            if (!imgEl) {
              imgEl = await new Promise((res) => {
                const im = new Image();
                im.onload = () => res(im);
                im.src = page.dataUrl;
              });
            }

            const renderedCanvas = renderCompositePageToCanvas(page, imgEl, globalVarsMap, true);
            const jpegDataUrl = renderedCanvas.toDataURL('image/jpeg', 0.96);

            if (i > 0) {
              pdf.addPage('a4', 'portrait');
            }
            pdf.addImage(jpegDataUrl, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
          }

          const docSlug = (globalVarsMap.Numero_Doc || 'Documentos_A4').replace(/[^a-zA-Z0-9-_]/g, '_');
          pdf.save(`Documentos_A4_${docSlug}.pdf`);
          showToast(`PDF A4 com ${pages.length} página(s) gerado com sucesso!`, 'success');
        } catch (err) {
          showToast('Erro ao gerar o PDF. Tente usar o botão Imprimir A4 e escolher "Salvar como PDF".', 'error');
        } finally {
          setPdfGenerating(false);
        }
      };

      const handleDirectPrint = async () => {
        if (!pages.length) return;
        const snapshots = [];

        for (let i = 0; i < pages.length; i++) {
          const page = pages[i];
          const imgEl = imageElementsRef.current[page.id];
          if (imgEl) {
            const c = renderCompositePageToCanvas(page, imgEl, globalVarsMap, true);
            snapshots.push({ id: page.id, url: c.toDataURL('image/png') });
          }
        }

        setPrintSnapshots(snapshots);
        setTimeout(() => {
          window.print();
        }, 250);
      };

      const handleExportTemplate = () => {
        const templateData = {
          version: '2.0',
          globalVars,
          pageMappings: pages.map((p, idx) => ({
            pageIndex: idx,
            pageName: p.name,
            boxes: p.boxes
          }))
        };
        const blob = new Blob([JSON.stringify(templateData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Mapeamento_A4_Doc_Studio.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('Molde de mapeamento exportado (.json)!', 'success');
      };

      const handleImportTemplate = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (parsed.globalVars) {
              const todayStr = formatSystemDate(new Date(), dateFormat);
              setGlobalVars(
                parsed.globalVars.map((v) =>
                  (v.key.toLowerCase() === 'data' || v.isAutoDate) && autoDateEnabled
                    ? { ...v, value: todayStr, isAutoDate: true }
                    : v
                )
              );
            }
            if (Array.isArray(parsed.pageMappings)) {
              setPages((prev) =>
                prev.map((p, idx) => {
                  const found = parsed.pageMappings.find((m) => m.pageIndex === idx);
                  return found ? { ...p, boxes: found.boxes || [] } : p;
                })
              );
            }
            showToast('Molde de mapeamento aplicado às páginas!', 'success');
          } catch (err) {
            showToast('Arquivo JSON de molde inválido.', 'error');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const handleAddGlobalVar = (e) => {
        e.preventDefault();
        const cleanKey = newVarKey
          .trim()
          .replace(/\s+/g, '_')
          .replace(/[^a-zA-Z0-9_]/g, '');
        if (!cleanKey) {
          showToast('Digite um código identificador para o dado em lote.', 'warning');
          return;
        }
        if (globalVars.some((v) => v.key.toLowerCase() === cleanKey.toLowerCase())) {
          showToast('Já existe um dado em lote com esse código.', 'warning');
          return;
        }
        const labelToUse = newVarLabel.trim() || cleanKey.replace(/_/g, ' ');
        setGlobalVars((prev) => [
          ...prev,
          {
            key: cleanKey,
            label: labelToUse,
            value: newVarValue || '',
            isAutoDate: cleanKey.toLowerCase() === 'data'
          }
        ]);
        setNewVarKey('');
        setNewVarLabel('');
        setNewVarValue('');
        showToast(`Dado em lote {{${cleanKey}}} adicionado!`, 'success');
      };

      const handleDeleteGlobalVar = (keyToRemove) => {
        setGlobalVars((prev) => prev.filter((v) => v.key !== keyToRemove));
        showToast(`Dado em lote {{${keyToRemove}}} removido.`, 'info');
      };

      const handleRenameGlobalVarKey = (idx, newRawKey) => {
        const cleaned = newRawKey.replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_]/g, '');
        if (!cleaned) return;
        const oldKey = globalVars[idx]?.key;
        if (!oldKey || oldKey === cleaned) return;

        setGlobalVars((prev) =>
          prev.map((v, i) => (i === idx ? { ...v, key: cleaned } : v))
        );

        setPages((prevPages) =>
          prevPages.map((p) => ({
            ...p,
            boxes: p.boxes.map((b) => {
              const escapedOld = oldKey.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(`\\{\\{${escapedOld}\\}\\}`, 'gi');
              return {
                ...b,
                linkedVar: b.linkedVar === oldKey ? cleaned : b.linkedVar,
                text: b.text ? b.text.replace(regex, `{{${cleaned}}}`) : b.text
              };
            })
          }))
        );
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans select-none">
          {/* CONTAINER EXCLUSIVO PARA IMPRESSÃO A4 NATIVA */}
          <div className="print-only-container hidden">
            {printSnapshots.map((snap) => (
              <div key={snap.id} className="print-a4-sheet">
                <img src={snap.url} alt="Folha A4 para Impressão" />
              </div>
            ))}
          </div>

          {/* NOTIFICAÇÃO TOAST */}
          {toastMessage && (
            <div className="no-print fixed bottom-5 right-5 z-50 flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-2xl border border-slate-700 bg-slate-900/95 text-slate-100 text-sm animate-bounce">
              {toastMessage.type === 'success' ? (
                <Icon name="CheckCircle2" className="w-4 h-4 text-emerald-400 shrink-0" />
              ) : (
                <Icon name="AlertCircle" className="w-4 h-4 text-amber-400 shrink-0" />
              )}
              <span>{toastMessage.msg}</span>
            </div>
          )}

          {/* BARRA SUPERIOR DE COMANDO */}
          <header className="no-print h-16 border-b border-slate-800 bg-slate-900/90 backdrop-blur px-4 flex items-center justify-between gap-3 shrink-0 z-20">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-teal-500 to-emerald-600 flex items-center justify-center shadow-lg shadow-teal-900/40">
                <Icon name="FileText" className="w-5 h-5 text-white" />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-bold text-base tracking-tight text-white">A4 Doc Studio</h1>
                  <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-teal-500/15 text-teal-300 border border-teal-500/30">
                    Editor Multi-Páginas A4
                  </span>
                </div>
                <p className="text-xs text-slate-400">
                  Substituição de termos com detecção nativa de fonte, dados em lote e gerador PDF
                </p>
              </div>
            </div>

            {/* FERRAMENTAS CENTRAIS DO CANVAS */}
            <div className="flex items-center gap-1.5 bg-slate-950/90 p-1.5 rounded-xl border border-slate-800">
              <button
                onClick={() => setToolMode('draw')}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition ${
                  toolMode === 'draw'
                    ? 'bg-teal-600 text-white shadow'
                    : 'text-slate-300 hover:bg-slate-800'
                }`}
                title="Clique e arraste sobre um termo na imagem para cobrir o texto antigo e detectar a fonte"
              >
                <Icon name="MousePointer" className="w-3.5 h-3.5" />
                <span>Mapear Termo</span>
              </button>

              <button
                onClick={() => setToolMode('mark_x')}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                  toolMode === 'mark_x'
                    ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-950/50'
                    : 'text-amber-300 hover:bg-slate-800 border border-amber-500/30'
                }`}
                title="Clique dentro de qualquer caixa de seleção vazia [ ] no documento para marcar um 'X' automaticamente"
              >
                <Icon name="CheckSquare" className="w-3.5 h-3.5" />
                <span>Marcar "X" (1 Clique)</span>
              </button>

              <button
                onClick={() => setToolMode('select')}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition ${
                  toolMode === 'select'
                    ? 'bg-teal-600 text-white shadow'
                    : 'text-slate-300 hover:bg-slate-800'
                }`}
                title="Mover ou redimensionar caixas já criadas"
              >
                <Icon name="Move" className="w-3.5 h-3.5" />
                <span>Mover / Ajustar</span>
              </button>

              <div className="h-4 w-px bg-slate-800 mx-1" />

              <button
                onMouseDown={() => setCompareOriginal(true)}
                onMouseUp={() => setCompareOriginal(false)}
                onMouseLeave={() => setCompareOriginal(false)}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition ${
                  compareOriginal
                    ? 'bg-amber-600 text-white'
                    : 'text-slate-300 hover:bg-slate-800'
                }`}
                title="Segure para ver a imagem A4 original sem substituições"
              >
                <Icon name={compareOriginal ? 'EyeOff' : 'Eye'} className="w-3.5 h-3.5" />
                <span>Segure p/ Ver Original</span>
              </button>

              <div className="h-4 w-px bg-slate-800 mx-1" />

              <button
                onClick={() => setZoom((z) => Math.max(0.35, Number((z - 0.1).toFixed(2))))}
                className="p-1.5 rounded-lg text-slate-300 hover:bg-slate-800"
                title="Diminuir Zoom"
              >
                <Icon name="ZoomOut" className="w-4 h-4" />
              </button>
              <span className="text-xs font-mono text-slate-300 w-12 text-center">
                {Math.round(zoom * 100)}%
              </span>
              <button
                onClick={() => setZoom((z) => Math.min(1.4, Number((z + 0.1).toFixed(2))))}
                className="p-1.5 rounded-lg text-slate-300 hover:bg-slate-800"
                title="Aumentar Zoom"
              >
                <Icon name="ZoomIn" className="w-4 h-4" />
              </button>
            </div>

            {/* AÇÕES DE ARQUIVO, PDF E IMPRESSÃO */}
            <div className="flex items-center gap-2">
              <input
                ref={templateInputRef}
                type="file"
                accept=".json"
                onChange={handleImportTemplate}
                className="hidden"
              />
              <button
                onClick={() => templateInputRef.current?.click()}
                className="flex items-center gap-1.5 px-2.5 py-2 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition"
                title="Carregar Molde de Mapeamento (.json)"
              >
                <Icon name="FolderOpen" className="w-3.5 h-3.5 text-teal-400" />
                <span className="hidden xl:inline">Abrir Molde</span>
              </button>

              <button
                onClick={handleExportTemplate}
                className="flex items-center gap-1.5 px-2.5 py-2 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition"
                title="Salvar Posições e Fontes para uso diário (.json)"
              >
                <Icon name="Save" className="w-3.5 h-3.5 text-teal-400" />
                <span className="hidden xl:inline">Salvar Molde</span>
              </button>

              <button
                onClick={handleGenerateMultiPagePDF}
                disabled={pdfGenerating || !pages.length}
                className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white shadow-lg shadow-emerald-950/50 transition"
              >
                {pdfGenerating ? (
                  <Icon name="Loader2" className="w-4 h-4 animate-spin" />
                ) : (
                  <Icon name="Download" className="w-4 h-4" />
                )}
                <span>Gerar PDF ({pages.length} pág.)</span>
              </button>

              <button
                onClick={handleDirectPrint}
                disabled={!pages.length}
                className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold bg-teal-600 hover:bg-teal-500 disabled:opacity-50 text-white shadow-lg shadow-teal-950/50 transition"
              >
                <Icon name="Printer" className="w-4 h-4" />
                <span>Imprimir A4</span>
              </button>
            </div>
          </header>

          {/* ÁREA DE TRABALHO PRINCIPAL (3 COLUNAS) */}
          <div className="no-print flex-1 flex overflow-hidden">
            {/* COLUNA ESQUERDA: FILA DE PÁGINAS A4 */}
            <aside className="w-64 border-r border-slate-800 bg-slate-900/60 flex flex-col shrink-0">
              <div className="p-3.5 border-b border-slate-800 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <Icon name="Layers" className="w-4 h-4 text-teal-400" />
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-300">
                    Páginas A4 ({pages.length})
                  </span>
                </div>

                <input
                  ref={fileInputRef}
                  type="file"
                  accept="image/*"
                  multiple
                  onChange={handleUploadPages}
                  className="hidden"
                />
                <button
                  onClick={() => fileInputRef.current?.click()}
                  className="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-teal-600 hover:bg-teal-500 text-white text-xs font-semibold transition"
                  title="Adicionar uma ou mais imagens A4 (PNG, JPG, WEBP)"
                >
                  <Icon name="Plus" className="w-3.5 h-3.5" />
                  <span>Adicionar</span>
                </button>
              </div>

              <div className="flex-1 overflow-y-auto p-3 space-y-2.5">
                {pages.map((p, index) => {
                  const isSelected = p.id === activePageId;
                  return (
                    <div
                      key={p.id}
                      onClick={() => {
                        setActivePageId(p.id);
                        setSelectedBoxId(p.boxes[0]?.id || null);
                      }}
                      className={`group relative rounded-xl p-2.5 border transition cursor-pointer flex gap-3 items-center ${
                        isSelected
                          ? 'bg-teal-950/40 border-teal-500/60 shadow-md'
                          : 'bg-slate-900/90 border-slate-800 hover:border-slate-700'
                      }`}
                    >
                      <div className="w-12 h-16 bg-white rounded border border-slate-700 overflow-hidden shrink-0 relative">
                        <img
                          src={p.dataUrl}
                          alt={p.name}
                          className="w-full h-full object-cover"
                        />
                        <span className="absolute bottom-0 right-0 bg-slate-900/80 text-[10px] font-bold px-1 text-teal-300">
                          #{index + 1}
                        </span>
                      </div>

                      <div className="flex-1 min-w-0">
                        <p className="text-xs font-semibold text-slate-200 truncate" title={p.name}>
                          {p.name}
                        </p>
                        <p className="text-[11px] text-slate-400 mt-0.5">
                          {p.boxes.length} termo(s) mapeado(s)
                        </p>
                        <div className="flex items-center gap-1 mt-1.5">
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              movePageOrder(index, -1);
                            }}
                            disabled={index === 0}
                            className="p-1 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-slate-300"
                            title="Mover página para cima"
                          >
                            <Icon name="ChevronUp" className="w-3 h-3" />
                          </button>
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              movePageOrder(index, 1);
                            }}
                            disabled={index === pages.length - 1}
                            className="p-1 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-slate-300"
                            title="Mover página para baixo"
                          >
                            <Icon name="ChevronDown" className="w-3 h-3" />
                          </button>
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              removePage(p.id);
                            }}
                            className="p-1 rounded bg-slate-800 hover:bg-rose-900/60 text-slate-400 hover:text-rose-300 ml-auto"
                            title="Remover página"
                          >
                            <Icon name="Trash2" className="w-3 h-3" />
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {pages.length > 0 && (
                <div className="p-3 border-t border-slate-800 bg-slate-950/50">
                  <button
                    onClick={() => {
                      setPages([]);
                      setActivePageId(null);
                      setSelectedBoxId(null);
                      showToast('Todas as páginas foram removidas da fila.', 'info');
                    }}
                    className="w-full flex items-center justify-center gap-1.5 py-2 px-3 rounded-lg bg-slate-800 hover:bg-rose-950/70 text-slate-300 hover:text-rose-300 text-xs font-medium transition border border-slate-700"
                  >
                    <Icon name="Trash2" className="w-3.5 h-3.5" />
                    <span>Limpar Todas as Páginas</span>
                  </button>
                </div>
              )}
            </aside>

            {/* COLUNA CENTRAL: MESA DIGITALIZADORA A4 INTERATIVA */}
            <main
              className="flex-1 bg-slate-950 overflow-auto flex flex-col items-center p-6 relative"
              onMouseMove={handleCanvasMouseMove}
              onMouseUp={handleCanvasMouseUp}
            >
              <div className="mb-4 px-4 py-2 rounded-full bg-slate-900/90 border border-slate-800 text-xs text-slate-300 flex items-center gap-3 shadow-lg">
                <Icon name="Sparkles" className="w-3.5 h-3.5 text-teal-400 shrink-0" />
                {toolMode === 'mark_x' ? (
                  <div className="flex items-center gap-2">
                    <span>
                      <strong>Modo Marcar "X" Ativo:</strong> Clique nas caixas vazias <code className="text-amber-300">[ ]</code> para marcar ou use <strong>Botão Direito / Delete</strong> para excluir.
                    </span>
                    <div className="flex items-center gap-1 ml-2 bg-slate-950 px-2 py-0.5 rounded-lg border border-slate-800">
                      <span className="text-[11px] text-slate-400">Símbolo:</span>
                      {['X', 'x', '✓'].map((sym) => (
                        <button
                          key={sym}
                          onClick={() => setCheckboxSymbol(sym)}
                          className={`px-1.5 py-0.5 rounded text-xs font-bold ${
                            checkboxSymbol === sym
                              ? 'bg-amber-500 text-slate-950'
                              : 'text-slate-300 hover:bg-slate-800'
                          }`}
                        >
                          {sym}
                        </button>
                      ))}
                    </div>
                  </div>
                ) : (
                  <span>
                    <strong>Dica:</strong> Arraste para substituir termos, use <strong>Marcar "X"</strong> para caixas vazias, ou <strong>Botão Direito / tecla Delete</strong> para excluir uma caixa.
                  </span>
                )}
              </div>

              {activePage ? (
                <div
                  ref={pageContainerRef}
                  onMouseDown={handleCanvasMouseDown}
                  style={{
                    width: `${Math.round(activePage.width * zoom)}px`,
                    height: `${Math.round(activePage.height * zoom)}px`
                  }}
                  className={`relative bg-white shadow-2xl border border-slate-700 transition-shadow ${
                    toolMode === 'draw' || toolMode === 'mark_x' ? 'cursor-crosshair' : 'cursor-default'
                  }`}
                >
                  <img
                    src={activePage.dataUrl}
                    alt={activePage.name}
                    draggable={false}
                    className="w-full h-full object-contain pointer-events-none select-none"
                  />

                  {!compareOriginal &&
                    activePage.boxes.map((box) => {
                      const isBoxSelected = box.id === selectedBoxId;
                      const pad = Number(box.maskPadding ?? 2);
                      const displayStr = resolveText(box.text, box.uppercase);

                      return (
                        <div
                          key={box.id}
                          data-box-item="true"
                          onMouseDown={(e) => handleBoxMouseDown(e, box, 'moving')}
                          onContextMenu={(e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            deleteBoxById(box.id);
                          }}
                          onDoubleClick={(e) => {
                            e.stopPropagation();
                            if (
                              box.isCheckbox ||
                              box.text === 'X' ||
                              box.text === 'x' ||
                              box.text === '✓' ||
                              box.text === ''
                            ) {
                              const nextVal = box.text ? '' : checkboxSymbol || 'X';
                              updateSelectedBox({ text: nextVal, isCheckbox: true });
                            }
                          }}
                          style={{
                            left: `${((box.x - pad) / activePage.width) * 100}%`,
                            top: `${((box.y - pad) / activePage.height) * 100}%`,
                            width: `${((box.width + pad * 2) / activePage.width) * 100}%`,
                            height: `${((box.height + pad * 2) / activePage.height) * 100}%`,
                            backgroundColor: box.transparentMask
                              ? 'transparent'
                              : box.maskColor || '#ffffff',
                            fontFamily: `"${box.fontFamily || 'Arial Narrow'}", Arial, sans-serif`,
                            fontSize: `${box.fontSize * zoom}px`,
                            fontWeight: box.fontWeight || '400',
                            fontStyle: box.fontStyle || 'normal',
                            color: box.textColor || '#1e293b',
                            letterSpacing: `${(box.letterSpacing || 0) * zoom}px`,
                            justifyContent:
                              box.textAlign === 'center'
                                ? 'center'
                                : box.textAlign === 'right'

                            isDateField
                              ? 'bg-teal-950/20 border-teal-500/40'
                              : 'bg-slate-950/70 border-slate-800'
                          }`}
                        >
                          <div className="flex items-center gap-1.5">
                            <Icon name="Edit3" className="w-3 h-3 text-slate-500 shrink-0" />
                            <input
                              type="text"
                              value={item.label}
                              onChange={(e) => {
                                const newLabel = e.target.value;
                                setGlobalVars((prev) =>
                                  prev.map((v, i) =>
                                    i === idx ? { ...v, label: newLabel } : v
                                  )
                                );
                              }}
                              placeholder="Nome do campo"
                              className="flex-1 bg-transparent text-xs font-semibold text-slate-200 focus:outline-none focus:border-b focus:border-teal-500 min-w-0"
                            />

                            <button
                              type="button"
                              onClick={() => {
                                if (selectedBox) {
                                  updateSelectedBox({
                                    linkedVar: item.key,
                                    text: `{{${item.key}}}`
                                  });
                                  showToast(
                                    `Variável {{${item.key}}} vinculada à caixa selecionada!`,
                                    'success'
                                  );
                                } else {
                                  showToast(
                                    `Selecione uma caixa na folha A4 primeiro para inserir {{${item.key}}}.`,
                                    'info'
                                  );
                                }
                              }}
                              className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-900 hover:bg-teal-900/60 text-teal-400 border border-slate-700 hover:border-teal-500/50 transition shrink-0"
                            >
                              {`{{${item.key}}}`}
                            </button>

                            <button
                              type="button"
                              onClick={() => handleDeleteGlobalVar(item.key)}
                              className="p-1 rounded hover:bg-rose-950/70 text-slate-500 hover:text-rose-400 transition shrink-0"
                              title="Remover este dado em lote"
                            >
                              <Icon name="Trash2" className="w-3.5 h-3.5" />
                            </button>
                          </div>

                          <div className="flex items-center gap-2">
                            <input
                              type="text"
                              value={item.value}
                              readOnly={isDateField && autoDateEnabled}
                              onChange={(e) => {
                                const val = e.target.value;
                                setGlobalVars((prev) =>
                                  prev.map((v, i) =>
                                    i === idx ? { ...v, value: val } : v
                                  )
                                );
                              }}
                              placeholder="Valor a ser preenchido nos documentos..."
                              className={`w-full px-2.5 py-1.5 rounded-lg border text-xs focus:outline-none ${
                                isDateField && autoDateEnabled
                                  ? 'bg-slate-900/60 border-teal-500/30 text-teal-200 font-semibold cursor-not-allowed'
                                  : 'bg-slate-900 border-slate-700 text-white focus:border-teal-500'
                              }`}
                            />
                          </div>

                          <div className="flex items-center justify-between text-[10px] text-slate-500 pt-0.5">
                            <span>Código da tag:</span>
                            <input
                              type="text"
                              value={item.key}
                              onChange={(e) => handleRenameGlobalVarKey(idx, e.target.value)}
                              className="bg-slate-900/80 border border-slate-800 rounded px-1.5 py-0.5 font-mono text-[10px] text-slate-300 w-36 text-right focus:outline-none focus:border-teal-500"
                            />
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <form
                    onSubmit={handleAddGlobalVar}
                    className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2.5"
                  >
                    <span className="text-xs font-bold text-slate-200 block">
                      + Adicionar Novo Dado em Lote
                    </span>
                    <input
                      type="text"
                      placeholder="Título do campo (ex: Nome do Cliente)"
                      value={newVarLabel}
                      onChange={(e) => {
                        setNewVarLabel(e.target.value);
                        if (!newVarKey) {
                          setNewVarKey(
                            e.target.value
                              .trim()
                              .replace(/\s+/g, '_')
                              .replace(/[^a-zA-Z0-9_]/g, '')
                          );
                        }
                      }}
                      className="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:border-teal-500"
                    />
                    <input
                      type="text"
                      placeholder="Código da tag (ex: Cliente)"
                      value={newVarKey}
                      onChange={(e) => setNewVarKey(e.target.value)}
                      className="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs font-mono text-teal-300 focus:outline-none focus:border-teal-500"
                    />
                    <input
                      type="text"
                      placeholder="Valor para substituir nos documentos"
                      value={newVarValue}
                      onChange={(e) => setNewVarValue(e.target.value)}
                      className="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:border-teal-500"
                    />
                    <button
                      type="submit"
                      className="w-full py-2 rounded-lg bg-teal-600 hover:bg-teal-500 text-white text-xs font-semibold transition"
                    >
                      Criar Dado em Lote
                    </button>
                  </form>
                </div>
              )}
            </aside>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
